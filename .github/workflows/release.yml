name: Signed release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - run: python -m unittest discover -s tests -v
      - run: python make_release.py
      - name: Sign and verify
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_KEY"
          key="$RUNNER_TEMP/release-private.pem"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          asset="../minecraft-pi-monitor-$(cat VERSION).zip"
          openssl dgst -sha256 -sign "$key" -out "$asset.sig" "$asset"
          openssl dgst -sha256 -verify update_pubkey.pem -signature "$asset.sig" "$asset"
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset="../minecraft-pi-monitor-$(cat VERSION).zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" "$asset.sig" "$asset.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" "$asset.sig" "$asset.sha256" --verify-tag --title "Minecraft Pi Monitor $GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi
